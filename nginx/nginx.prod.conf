resolver 127.0.0.11 valid=30s ipv6=off;

upstream portal-api {
    server api-server:8080;
}

server {
    listen 80;
    server_name localhost;

    # Portal API
    location /api/portal/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin OAuth2 login and callback
    location /oauth2/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Health & Summary
    location /health {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    location /api/summary {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # Development diagnostics and Office hooks are never published.
    location ~ ^/(actuator|swagger-ui|v3/api-docs|api-docs|admin/office|api/admin/office)(/|$) {
        return 404;
    }
    location = /swagger-ui.html { return 404; }

    # AI Benchmark API
    # NOTE: ai-benchmark-api 프로젝트가 아직 없어 비활성화 (docker-compose.yml의 ai-api-server 주석과 동일)
    #       프로젝트 생성 후 주석 해제
    # location /api/ai/ {
    #     set $ai_upstream http://ai-api-server:8000;
    #     proxy_pass $ai_upstream;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Public, read-only presence stream. No ingestion endpoint is exposed.
    location = /api/office/events {
        set $office_upstream http://frontend:3000;
        proxy_pass $office_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    # Frontend (동적 resolve — 서비스 미기동 시에도 Nginx 시작 가능)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Error pages
    error_page 502 /502.html;
    location = /502.html {
        default_type application/json;
        return 502 '{"error":"Service Unavailable","message":"Backend service is not responding"}';
    }
}
