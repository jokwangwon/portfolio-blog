upstream portal-api {
    server api-server:8080;
}

upstream ai-api {
    server ai-api-server:8000;
}

server {
    listen 80;
    server_name localhost;

    # Portal API
    location /api/portal/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Health & Summary
    location /health {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    location /api/summary {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # Actuator (internal only in prod)
    location /actuator/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # AI Benchmark API
    location /api/ai/ {
        proxy_pass http://ai-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Error pages
    error_page 502 /502.html;
    location = /502.html {
        default_type text/html;
        return 502 '{"error":"Service Unavailable","message":"Backend service is not responding"}';
    }
}
