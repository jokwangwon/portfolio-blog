resolver 127.0.0.11 valid=30s ipv6=off;

upstream portal-api {
    server api-server:8080;
}

server {
    listen 80;
    server_name localhost;

    # Portal API
    location /api/portal/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Health & Summary
    location /health {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    location /api/summary {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # Actuator (internal only in prod)
    location /actuator/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    location /v3/api-docs/ {
        proxy_pass http://portal-api;
        proxy_set_header Host $host;
    }

    # AI Benchmark API (동적 resolve — 서비스 미기동 시에도 Nginx 시작 가능)
    location /api/ai/ {
        set $ai_upstream http://ai-api-server:8000;
        proxy_pass $ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (동적 resolve — 서비스 미기동 시에도 Nginx 시작 가능)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Error pages
    error_page 502 /502.html;
    location = /502.html {
        default_type application/json;
        return 502 '{"error":"Service Unavailable","message":"Backend service is not responding"}';
    }
}
