openapi: 3.0.3
info:
  title: Portfolio Portal API
  description: |
    REST API for Portfolio Portal (Blog, Auth, Service Registry) + AI Benchmark

    ## Features
    - JWT Authentication with Refresh Token Rotation
    - Blog CRUD (Posts, Categories, Tags, Comments)
    - AI Model Benchmark & Inference
    - OAuth2 Social Login

    ## Authentication
    Most endpoints require JWT authentication via `Authorization: Bearer {token}` header.

  version: 1.0.0
  contact:
    name: API Support
    email: your.email@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/portal
    description: Local Development (Portal API)
  - url: http://localhost:8000/api/ai
    description: Local Development (AI Benchmark API)
  - url: https://api.yourdomain.com/api/portal
    description: Production (Portal API)

tags:
  - name: Service Contract
    description: Health check & summary (모든 서비스 필수 구현)
  - name: Auth
    description: Authentication & Authorization
  - name: Posts
    description: Blog post management
  - name: Categories
    description: Post categories
  - name: Tags
    description: Post tags
  - name: Comments
    description: Comment management
  - name: Users
    description: User management
  - name: AI Models
    description: AI model management
  - name: Benchmark
    description: AI benchmark operations

paths:
  # ==========================================
  # Service Contract (모든 서비스 필수)
  # ==========================================
  /health:
    get:
      tags: [Service Contract]
      summary: 헬스 체크
      description: 서비스 상태 확인 (DB 연결 포함)
      operationId: healthCheck
      responses:
        '200':
          description: 상태 반환 (status 값으로 판단)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/summary:
    get:
      tags: [Service Contract]
      summary: 서비스 요약 데이터
      description: 포털 대시보드용 서비스 요약 정보
      operationId: getServiceSummary
      responses:
        '200':
          description: 요약 데이터 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceSummary'
        '500':
          description: 요약 데이터 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================
  # Authentication
  # ==========================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: 새로운 사용자 계정 생성
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                username:
                  type: string
                  minLength: 3
                  maxLength: 20
                  example: johndoe
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecureP@ss123
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                    example: 1
                  email:
                    type: string
                    example: user@example.com
                  username:
                    type: string
                    example: johndoe
                  role:
                    type: string
                    example: USER
                  createdAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이메일 또는 사용자명 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: 이메일/비밀번호로 로그인하여 Access Token 및 Refresh Token 발급
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecureP@ss123
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: Refresh Token (HttpOnly Cookie)
              schema:
                type: string
                example: refresh_token=abc123...; HttpOnly; Secure; SameSite=Strict; Max-Age=604800; Path=/api/portal/auth/refresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  username:
                    type: string
                    example: johndoe
                  role:
                    type: string
                    example: USER
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 갱신
      description: Refresh Token을 사용하여 새로운 Access Token 및 Refresh Token 발급 (Rotation)
      operationId: refreshToken
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 토큰 갱신 성공
          headers:
            Set-Cookie:
              description: 새로운 Refresh Token (HttpOnly Cookie)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '401':
          description: Refresh Token 만료 또는 재사용 감지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      description: Refresh Token 무효화 및 쿠키 삭제
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # Posts
  # ==========================================
  /posts:
    get:
      tags: [Posts]
      summary: 게시글 목록 조회
      description: 페이징 처리된 게시글 목록 조회
      operationId: getPosts
      parameters:
        - name: page
          in: query
          description: 페이지 번호 (0부터 시작)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          description: 페이지 크기
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: categoryId
          in: query
          description: 카테고리 필터
          schema:
            type: integer
            format: int64
        - name: tagId
          in: query
          description: 태그 필터
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          description: 상태 필터
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, ARCHIVED]
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            type: string
            enum: [createdAt,desc, createdAt,asc, viewCount,desc, likeCount,desc]
            default: createdAt,desc
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  page:
                    type: integer
                    example: 0
                  size:
                    type: integer
                    example: 20
                  totalElements:
                    type: integer
                    example: 150
                  totalPages:
                    type: integer
                    example: 8

    post:
      tags: [Posts]
      summary: 게시글 작성
      description: 새로운 게시글 작성 (인증 필요)
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '201':
          description: 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /posts/{id}:
    get:
      tags: [Posts]
      summary: 게시글 상세 조회
      description: ID로 게시글 상세 정보 조회
      operationId: getPost
      parameters:
        - name: id
          in: path
          required: true
          description: 게시글 ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Posts]
      summary: 게시글 수정
      description: 게시글 내용 수정 (작성자 또는 관리자만)
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Posts]
      summary: 게시글 삭제
      description: 게시글 삭제 (Soft Delete, 작성자 또는 관리자만)
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # Posts - Search & Like
  # ==========================================
  /posts/search:
    get:
      tags: [Posts]
      summary: 게시글 검색
      operationId: searchPosts
      parameters:
        - name: q
          in: query
          required: true
          description: 검색어 (2자 이상)
          schema:
            type: string
            minLength: 2
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 검색 결과 (페이징)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPostSummary'

  /posts/{id}/like:
    post:
      tags: [Posts]
      summary: 좋아요 추가
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 좋아요 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '409':
          description: 이미 좋아요한 게시글
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Posts]
      summary: 좋아요 취소
      operationId: unlikePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 좋아요 취소 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'

  # ==========================================
  # Categories (CRUD)
  # ==========================================
  /categories:
    get:
      tags: [Categories]
      summary: 카테고리 목록 조회
      operationId: getCategories
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: 카테고리 생성 (ADMIN)
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 이름/slug 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories/{id}:
    put:
      tags: [Categories]
      summary: 카테고리 수정 (ADMIN)
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Categories]
      summary: 카테고리 삭제 (ADMIN)
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # Tags (CRUD)
  # ==========================================
  /tags:
    get:
      tags: [Tags]
      summary: 태그 목록 조회
      operationId: getTags
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
    post:
      tags: [Tags]
      summary: 태그 생성 (ADMIN)
      operationId: createTag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tags/{id}:
    put:
      tags: [Tags]
      summary: 태그 수정 (ADMIN)
      operationId: updateTag
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
    delete:
      tags: [Tags]
      summary: 태그 삭제 (ADMIN)
      operationId: deleteTag
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공

  # ==========================================
  # Comments
  # ==========================================
  /posts/{postId}/comments:
    get:
      tags: [Comments]
      summary: 게시글 댓글 목록 조회
      operationId: getComments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'

    post:
      tags: [Comments]
      summary: 댓글 작성
      operationId: createComment
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
                parentId:
                  type: integer
                  format: int64
                  description: 답글인 경우 부모 댓글 ID
      responses:
        '201':
          description: 작성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /posts/{postId}/comments/{id}:
    put:
      tags: [Comments]
      summary: 댓글 수정
      operationId: updateComment
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Comments]
      summary: 댓글 삭제
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ==========================================
# Components
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token (Authorization: Bearer {token})

  schemas:
    # ==========================================
    # Post Schemas
    # ==========================================
    PostSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "My First Blog Post"
        slug:
          type: string
          example: "my-first-blog-post"
        excerpt:
          type: string
          example: "This is a short summary of the blog post..."
        author:
          type: object
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
              example: "johndoe"
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]
          example: PUBLISHED
        viewCount:
          type: integer
          example: 150
        likeCount:
          type: integer
          example: 25
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          properties:
            content:
              type: string
              description: Markdown 형식 콘텐츠
              example: "# Introduction\n\nThis is my first post..."
            publishedAt:
              type: string
              format: date-time

    PostCreateRequest:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: "My First Blog Post"
        content:
          type: string
          minLength: 1
          example: "# Introduction\n\nThis is my first post..."
        excerpt:
          type: string
          maxLength: 200
        categoryId:
          type: integer
          format: int64
          example: 1
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
          default: DRAFT

    PostUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
        excerpt:
          type: string
          maxLength: 200
        categoryId:
          type: integer
          format: int64
        tagIds:
          type: array
          items:
            type: integer
            format: int64
        status:
          type: string
          enum: [DRAFT, PUBLISHED, ARCHIVED]

    # ==========================================
    # Category & Tag Schemas
    # ==========================================
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Technology"
        slug:
          type: string
          example: "technology"
        description:
          type: string
          example: "Tech-related articles"

    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "React"
        slug:
          type: string
          example: "react"

    # ==========================================
    # Comment Schema
    # ==========================================
    Comment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        content:
          type: string
          example: "Great post!"
        author:
          type: object
          properties:
            id:
              type: integer
              format: int64
            username:
              type: string
              example: "janedoe"
        parentId:
          type: integer
          format: int64
          nullable: true
        replies:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ==========================================
    # Service Contract Schemas
    # ==========================================
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
          example: UP
        service:
          type: string
          example: portal-api
        version:
          type: string
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time
        error:
          type: string
          description: DOWN/DEGRADED 시 에러 메시지
          nullable: true

    ServiceSummary:
      type: object
      properties:
        service:
          type: string
          example: portal-api
        displayName:
          type: string
          example: "포트폴리오 포털"
        description:
          type: string
        icon:
          type: string
          example: globe
        stats:
          type: object
          additionalProperties: true
        routes:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              label:
                type: string

    # ==========================================
    # Paged Response
    # ==========================================
    PagedPostSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    # ==========================================
    # Like Response
    # ==========================================
    LikeResponse:
      type: object
      properties:
        postId:
          type: integer
          format: int64
        likeCount:
          type: integer
        liked:
          type: boolean

    # ==========================================
    # Category & Tag CRUD Schemas
    # ==========================================
    CategoryCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-z0-9-]+$'
        description:
          type: string
          maxLength: 500

    TagCreateRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[a-z0-9-]+$'

    # ==========================================
    # Error Response
    # ==========================================
    ErrorResponse:
      type: object
      required: [timestamp, status, error, message, errorCode]
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-01-07T10:30:00Z"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Validation failed"
        errorCode:
          type: string
          example: "VALIDATION_ERROR"
        path:
          type: string
          example: "/api/portal/posts"
        errors:
          type: array
          description: VALIDATION_ERROR 시 필드별 에러 목록
          items:
            type: object
            properties:
              field:
                type: string
                example: "email"
              message:
                type: string
                example: "이메일 형식이 올바르지 않습니다"

  responses:
    BadRequest:
      description: 잘못된 요청 (유효성 검증 실패)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-01-07T10:30:00Z"
            status: 400
            error: "Bad Request"
            message: "Title is required"
            errorCode: "VALIDATION_ERROR"

    Unauthorized:
      description: 인증 필요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-01-07T10:30:00Z"
            status: 401
            error: "Unauthorized"
            message: "JWT token is missing or invalid"
            errorCode: "UNAUTHORIZED"

    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-01-07T10:30:00Z"
            status: 403
            error: "Forbidden"
            message: "You don't have permission to access this resource"
            errorCode: "FORBIDDEN"

    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-01-07T10:30:00Z"
            status: 404
            error: "Not Found"
            message: "Post not found with id: 123"
            errorCode: "POST_NOT_FOUND"
