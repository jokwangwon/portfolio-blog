name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # --- Layer 4: Backend 검증 ---
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew check

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/**/build/reports/jacoco/
          retention-days: 7

  # --- Layer 4: Frontend 검증 (조건부) ---
  frontend-check:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: npm test

  # --- Layer 4: 문서 검증 ---
  docs-validate:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate cross-references
        run: bash scripts/validate-docs.sh

  # --- PR Gate: 모든 검증 통과 필수 ---
  pr-gate:
    name: PR Gate
    if: github.event_name == 'pull_request'
    needs: [backend-check, frontend-check, docs-validate]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All harness checks passed. PR is ready for review."
