# ==========================================
# 프로덕션 오버라이드 (GB10 홈서버 + Cloudflare Tunnel)
#
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile backend --profile frontend --profile gateway up -d --build
#
# 필수 환경변수 (.env): JWT_SECRET, PUBLIC_URL
# 터널 연결 시 추가: CLOUDFLARE_TUNNEL_TOKEN (--profile deploy)
# ==========================================

services:
  portal-db:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:?Set the existing database password before deployment}

  ai-bench-db:
    ports: !override []
    profiles: [benchmark]

  pgadmin:
    depends_on: !override
      portal-db:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  api-server:
    ports: !override []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_PUBLIC_READ_ONLY: "true"
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-not-configured}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-not-configured}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-not-configured}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-not-configured}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: ${PUBLIC_URL}/oauth2/callback/google
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_REDIRECT_URI: ${PUBLIC_URL}/oauth2/callback/github
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production (openssl rand -base64 64)}
      APP_FRONTEND_URL: ${PUBLIC_URL:?PUBLIC_URL must be set (e.g. https://blog.example.com)}
      APP_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
    restart: always

  frontend:
    ports: !override []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_PUBLIC_READ_ONLY: "true"
    environment:
      NODE_ENV: production
      OFFICE_PRESENCE_FILE: /office-presence/status.json
      BACKEND_URL: http://api-server:8080
    # dev 소스 마운트 제거 — 이미지에 빌드된 결과물 사용
    volumes: !override
      - ./.office-presence/public:/office-presence:ro
    restart: always

  ai-backend:
    ports: !override []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  nginx:
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:-80}:80"
    volumes: !override
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always

  # Cloudflare Tunnel — 외부 노출 + TLS (도메인의 Zero Trust 대시보드에서
  # Public Hostname → http://nginx:80 으로 라우팅 설정)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-tunnel
    # 토큰 미설정 시 cloudflared가 기동 실패 로그를 남김 (Zero Trust > Tunnels 에서 발급)
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks:
      - portal-network
    restart: always
    profiles:
      - deploy
