spring:
  # DataSource
  datasource:
    url: jdbc:postgresql://${PORTAL_DB_HOST:localhost}:${PORTAL_DB_PORT:5432}/${PORTAL_DB_NAME:portal_db}
    username: ${PORTAL_DB_USER:postgres}
    password: ${PORTAL_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# OAuth2 Social Login
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:google-client-id}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:google-client-secret}
            scope: email,profile
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID:github-client-id}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:github-client-secret}
            scope: user:email,read:user
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"

# AI Draft Generation
ai:
  notion-api-key: ${NOTION_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  ollama-host: ${OLLAMA_HOST:http://localhost:11434}
  ollama-model: ${OLLAMA_MODEL:gemma3:12b}
  gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}
  provider: ${AI_PROVIDER:ollama}

# Frontend URL (OAuth2 callback redirect)
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-here-minimum-256-bits-recommended-change-this-in-production}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}  # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true
