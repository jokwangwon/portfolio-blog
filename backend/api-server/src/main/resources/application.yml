spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: portfolio-portal-api

  # DataSource (환경변수로 주입, dev 프로필에서 오버라이드)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100
    show-sql: false

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

  # OAuth2 Social Login — 전 프로필 공통 필요
  # (SecurityConfig.oauth2Login이 ClientRegistrationRepository 빈을 요구하므로
  #  dev 프로필 전용으로 두면 prod 기동이 실패함)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:not-configured}
            scope: email,profile
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID:not-configured}
            client-secret: ${OAUTH_GITHUB_CLIENT_SECRET:not-configured}
            scope: user:email,read:user
            redirect-uri: "{baseUrl}/oauth2/callback/{registrationId}"

# Server
server:
  port: ${API_SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Sentry Error Tracking
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_RATE:0.1}
  environment: ${SENTRY_ENVIRONMENT:development}
  send-default-pii: false
  exception-resolver-order: -2147483647

# JWT (dev 프로필에서 오버라이드)
jwt:
  secret: ${JWT_SECRET:change-this-in-production-minimum-256-bits}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# App
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${APP_COOKIE_SECURE:false}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      aiBackend:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      aiBackend:
        max-attempts: 3
        wait-duration: 2s

# Logging — 공통 설정 (보안: BasicBinder TRACE는 SQL 파라미터 노출 위험)
logging:
  level:
    root: INFO
    com.portfolio: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
