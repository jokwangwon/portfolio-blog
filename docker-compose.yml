version: '3.8'

services:
  # ==========================================
  # Portal DB (PostgreSQL) - 인증, 블로그, Service Registry
  # ==========================================
  portal-db:
    image: postgres:15-alpine
    container_name: portal-db
    environment:
      POSTGRES_DB: ${PORTAL_DB_NAME:-portal_db}
      POSTGRES_USER: ${PORTAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PORTAL_DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORTAL_DB_PORT:-5432}:5432"
    volumes:
      - portal_db_data:/var/lib/postgresql/data
      - ./backend/api-server/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTAL_DB_USER:-postgres} -d ${PORTAL_DB_NAME:-portal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network
    restart: unless-stopped

  # ==========================================
  # AI Benchmark DB (TimescaleDB) - AI 벤치마크 전용
  # ==========================================
  ai-bench-db:
    image: timescale/timescaledb:latest-pg15
    container_name: ai-bench-db
    environment:
      POSTGRES_DB: ${AI_BENCH_DB_NAME:-ai_bench_db}
      POSTGRES_USER: ${AI_BENCH_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AI_BENCH_DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${AI_BENCH_DB_PORT:-5433}:5432"
    volumes:
      - ai_bench_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_BENCH_DB_USER:-postgres} -d ${AI_BENCH_DB_NAME:-ai_bench_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portal-network
    restart: unless-stopped

  # ==========================================
  # pgAdmin (Optional - Database Management UI)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: portfolio-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      portal-db:
        condition: service_healthy
      ai-bench-db:
        condition: service_healthy
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - tools

  # ==========================================
  # Portal API Server (Spring Boot)
  # ==========================================
  api-server:
    build:
      context: ./backend/api-server
      dockerfile: Dockerfile
    container_name: portfolio-api-server
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://portal-db:5432/${PORTAL_DB_NAME:-portal_db}
      SPRING_DATASOURCE_USERNAME: ${PORTAL_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${PORTAL_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    ports:
      - "${API_SERVER_PORT:-8080}:8080"
    depends_on:
      portal-db:
        condition: service_healthy
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - backend

  # ==========================================
  # AI Benchmark API Server (FastAPI)
  # ==========================================
  ai-api-server:
    build:
      context: ./ai-benchmark-api
      dockerfile: Dockerfile
    container_name: portfolio-ai-api
    environment:
      DATABASE_URL: postgresql://${AI_BENCH_DB_USER:-postgres}:${AI_BENCH_DB_PASSWORD:-postgres}@ai-bench-db:5432/${AI_BENCH_DB_NAME:-ai_bench_db}
      OLLAMA_HOST: ${OLLAMA_HOST:-host.docker.internal:11434}
      LOG_LEVEL: ${AI_API_LOG_LEVEL:-INFO}
    ports:
      - "${AI_API_PORT:-8000}:8000"
    depends_on:
      ai-bench-db:
        condition: service_healthy
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - backend

  # ==========================================
  # Frontend (Next.js)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: portfolio-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_AI_API_BASE_URL: ${VITE_AI_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - frontend

  # ==========================================
  # Nginx API Gateway
  # ==========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: portfolio-gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-server
    networks:
      - portal-network
    restart: unless-stopped
    profiles:
      - gateway

volumes:
  portal_db_data:
    driver: local
  ai_bench_db_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  portal-network:
    driver: bridge
